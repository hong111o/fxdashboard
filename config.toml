# FX Watch configuration
#
# Pairs are written BASE/QUOTE, meaning "how many QUOTE for 1 BASE"
# (e.g. GBP/HKD = 10.15 means 1 GBP costs 10.15 HKD).
#
# For each alert you say what you SELL and what you BUY. The direction of the
# alert is worked out for you:
#   - buying the BASE currency (e.g. sell HKD, buy GBP on GBP/HKD)
#       -> you want the rate LOW, alert when rate <= target
#   - selling the BASE currency (e.g. sell GBP, buy JPY on GBP/JPY)
#       -> you want the rate HIGH, alert when rate >= target
#
# basis = "mid"  -> compare the target with the mid-market rate
# basis = "best" -> compare the target with the best all-in rate you can
#                   actually get (after spread and fees) from the providers below

[settings]
cooldown_hours = 12            # don't repeat the same alert within this window...
realert_improvement_pct = 0.5  # ...unless the rate improved by this much since the last alert
history_days = 30              # look-back window for "30-day low/high" context
top_providers = 3              # how many providers to list in each notification

# ---------------------------------------------------------------- alerts ----

[[alert]]
name = "HKD -> GBP"
pair = "GBP/HKD"
sell = "HKD"
buy = "GBP"
amount = 50000          # in the SELL currency; used to price fees and compare providers
target = 10.00          # alert when 1 GBP costs <= 10.00 HKD
basis = "best"

[[alert]]
name = "USD -> GBP"
pair = "GBP/USD"
sell = "USD"
buy = "GBP"
amount = 5000
target = 1.28           # alert when 1 GBP costs <= 1.28 USD
basis = "best"

[[alert]]
name = "Japan trip (GBP -> JPY)"
pair = "GBP/JPY"
sell = "GBP"
buy = "JPY"
amount = 1000
target = 200            # alert when 1 GBP buys >= 200 JPY
basis = "best"

[[alert]]
name = "Europe trip (GBP -> EUR)"
pair = "GBP/EUR"
sell = "GBP"
buy = "EUR"
amount = 1000
target = 1.18           # alert when 1 GBP buys >= 1.18 EUR
basis = "best"

# ------------------------------------------------------------- providers ----
#
# Live quotes: Wise's public comparison API returns real quotes from Wise and
# from banks / transfer services it tracks for each corridor.
[wise_comparison]
enabled = true

# Manual providers: banks/brokers without a public quote API. The all-in rate is
#   received = (amount - fee) * mid_rate * (1 - margin_pct / 100)
# margin_pct = how far the provider's rate is from mid-market (the hidden spread).
# fee        = fixed fee per conversion/transfer, in fee_currency (converted at mid-market).
# currencies = optional; only use this provider when both currencies are listed.
#
# !! The numbers below are rough starting points, NOT verified quotes.
# !! To calibrate a bank: note its quoted rate in the app, compare with the
# !! mid-market rate at the same moment, and put the % difference in margin_pct.
# !! Remember the outward TT (telegraphic transfer) fee if you send HKD/USD to a UK account.

# --- accounts you already have ---

[[provider]]
name = "Hang Seng Bank (have)"
margin_pct = 0.6         # placeholder - calibrate from the app's GBP/HKD rate
fee = 0                  # add the outward TT fee if you send the GBP to the UK
fee_currency = "HKD"
currencies = ["HKD", "USD", "GBP", "EUR", "JPY", "AUD"]

[[provider]]
name = "Standard Chartered HK (have)"
margin_pct = 0.6         # placeholder - calibrate from the app's GBP/HKD rate
fee = 0                  # add the outward TT fee if you send the GBP to the UK
fee_currency = "HKD"
currencies = ["HKD", "USD", "GBP", "EUR", "JPY", "AUD"]

# --- accounts you are considering ---
# Wise is priced live by the comparison API above, so it doesn't need an entry here.

[[provider]]
name = "Interactive Brokers (considering)"
margin_pct = 0.002       # IBKR Pro FX commission ~0.2 bps...
fee = 2                  # ...with a USD 2 minimum per order (deposit/withdrawal fees not included)
fee_currency = "USD"

# ------------------------------------------------------ trading watchlist ----
#
# For short/mid-term trading ideas. Each watch can alert on:
#   below / above   -> price levels you choose (repeats after cooldown_hours while true)
#   move_pct        -> a daily move of at least this % either way
#   breakout_days   -> a new N-working-day high or low
#   sma_days        -> price crossing its N-day simple moving average (trend change)
# Rates are daily ECB reference rates, so these are end-of-day signals,
# suited to swing/position trading rather than intraday.
# Add below/above levels once you've looked at the charts.

[[watch]]
pair = "AUD/USD"
move_pct = 1.0
breakout_days = 20
sma_days = 50

[[watch]]
pair = "GBP/AUD"
move_pct = 1.0
breakout_days = 20
sma_days = 50

[[watch]]
pair = "AUD/JPY"         # a classic risk-sentiment barometer
move_pct = 1.2
breakout_days = 20
sma_days = 50

[[watch]]
pair = "NZD/USD"
move_pct = 1.0
breakout_days = 20
sma_days = 50

[[watch]]
pair = "USD/JPY"
move_pct = 1.0
breakout_days = 20
sma_days = 50

[[watch]]
pair = "EUR/USD"
move_pct = 0.8
breakout_days = 20
sma_days = 50

[[watch]]
pair = "USD/CAD"
move_pct = 0.8
breakout_days = 20
sma_days = 50
