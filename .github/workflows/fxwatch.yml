name: FX Watch

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "check = normal run, dry-run = no notifications, test-notify = send a test message"
        type: choice
        options: [check, dry-run, test-notify]
        default: check
      command:
        description: "Optional: change settings, e.g. /target GBP/HKD 10.05 (separate several with ;). /list shows them."
        type: string
        default: ""
      source:
        description: "Where the command came from (the WhatsApp relay sets 'whatsapp' so the reply goes there)"
        type: choice
        options: [form, whatsapp]
        default: form
  push:
    branches: [main]
    paths: ["fxwatch/**", "tests/**", "whatsapp-bot/**"]
  pull_request:

concurrency:
  group: fxwatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test whatsapp-bot/worker.test.mjs

  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit data/settings.json when targets change
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Alert state (when each alert last fired) is kept in the Actions cache
      # so repeat alerts respect the cooldown without committing to the repo.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: fxwatch-state-${{ github.run_id }}
          restore-keys: fxwatch-state-

      - name: Run FX Watch
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'check' }}
          COMMAND: ${{ inputs.command }}
          SOURCE: ${{ inputs.source || 'form' }}
        run: |
          args=(--source "$SOURCE")
          if [ -n "$COMMAND" ]; then args+=(--command "$COMMAND"); fi
          case "$MODE" in
            dry-run)     python -m fxwatch --dry-run "${args[@]}" ;;
            test-notify) python -m fxwatch --test-notify ;;
            *)           python -m fxwatch "${args[@]}" ;;
          esac

      - name: Save changed settings
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update FX Watch settings"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: fxwatch-state-${{ github.run_id }}
